<svg viewBox="0 0 800 80" width="800" height="80" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .seg { fill: #2E86DE; }
    .seg1 { animation: move 4s linear infinite; }
    .seg2 { animation: move 4s linear infinite; animation-delay: -0.3s; }
    .seg3 { animation: move 4s linear infinite; animation-delay: -0.6s; }
    .seg4 { animation: move 4s linear infinite; animation-delay: -0.9s; }
    .seg5 { animation: move 4s linear infinite; animation-delay: -1.2s; }
    .seg6 { animation: move 4s linear infinite; animation-delay: -1.5s; }
    .seg7 { animation: move 4s linear infinite; animation-delay: -1.8s; }
    .seg8 { animation: move 4s linear infinite; animation-delay: -2.1s; }
    @keyframes move {
      0%   { transform: translateX(-40px); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateX(840px); opacity: 0; }
    }
  </style>
  <circle class="seg seg1" cx="40" cy="40" r="14"/>
  <circle class="seg seg2" cx="40" cy="40" r="12"/>
  <circle class="seg seg3" cx="40" cy="40" r="10"/>
  <circle class="seg seg4" cx="40" cy="40" r="9"/>
  <circle class="seg seg5" cx="40" cy="40" r="8"/>
  <circle class="seg seg6" cx="40" cy="40" r="7"/>
  <circle class="seg seg7" cx="40" cy="40" r="6"/>
  <circle class="seg seg8" cx="40" cy="40" r="5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
